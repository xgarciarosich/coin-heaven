# cargo-deny policy for Coin Heaven.
#
#   cargo deny --manifest-path src-tauri/Cargo.toml check
#
# The app is installed by people who put real bank statements into it, so the
# supply chain is part of the threat model (docs/THREAT-MODEL.md). This file is
# the gate: a known vulnerability, a licence we have not looked at, or a crate
# from anywhere other than crates.io fails the check.

[graph]
# Only what ships. Linux-only crates (gtk, glib, webkit2gtk) are not built for
# macOS or Windows, so their advisories are not ours.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are errors too, anywhere in the tree. Each exception
# below says why it is safe to carry and when to drop it.
unmaintained = "all"
ignore = [
    # urlpattern -> unic-*. Reached only through tauri-utils, which uses it to
    # read this app's own tauri.conf.json / capabilities. No untrusted input.
    # Drop when tauri-utils moves off urlpattern 0.3.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: via tauri-utils, parses our own config only" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: via tauri-utils, parses our own config only" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: via tauri-utils, parses our own config only" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: via tauri-utils, parses our own config only" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: via tauri-utils, parses our own config only" },
    # lopdf -> ttf-parser. No known vulnerability, only "unmaintained". It
    # does sit on the untrusted-input path (embedded fonts in an imported
    # PDF), but that whole path runs in the throw-away `--pdf-text` child
    # process (src/import/pdf.rs). Drop when pdf-extract / lopdf replace it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: only inside the isolated --pdf-text child; no known vulnerability" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licences, plus the two the tree needs:
#   MPL-2.0   cssparser / selectors (file-level copyleft; used unmodified by tauri-utils)
#   CDLA-Permissive-2.0   webpki-root-certs (data licence for the CA list)
# LGPL-2.1-or-later appears only on r-efi, which is "MIT OR Apache-2.0 OR LGPL",
# and is not built for macOS or Windows; the OR lets us take MIT.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
# Two versions of one crate are binary size and a second place to patch, not
# a vulnerability. Worth seeing; not worth failing the build over.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# crates.io only: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
